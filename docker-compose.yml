version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: madm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}   # defina via env no Dokploy
      POSTGRES_DB: madm
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://madm:${POSTGRES_PASSWORD:-secret}@postgres:5432/madm
      SESSION_SECRET: ${SESSION_SECRET:-super-secret}   # defina via env
      ALLOWED_ORIGINS: https://comissionamento.madmbrasil.com.br   # apenas se necessário, mas pode ser omitido
      NODE_ENV: production
      FRONTEND_URL: https://comissionamento.madmbrasil.com.br
      PORT: 3007
    volumes:
      - uploads:/app/uploads
    networks:
      - internal
    # Não expor porta externa

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api   # importante: a API agora é acessada via proxy no mesmo domínio
    depends_on:
      - backend
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`comissionamento.madmbrasil.com.br`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  uploads: