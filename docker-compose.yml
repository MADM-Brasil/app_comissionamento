services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: madm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: madm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madm -d madm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://madm:${POSTGRES_PASSWORD:-secret}@postgres:5432/madm
      DB_SSL: 'false'
      SESSION_SECRET: ${SESSION_SECRET:-super-secret}
      ALLOWED_ORIGINS: https://comissionamento.madmbrasil.com.br
      NODE_ENV: production
      FRONTEND_URL: https://comissionamento.madmbrasil.com.br
      PORT: 3007
    volumes:
      - uploads:/app/uploads
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`comissionamento.madmbrasil.com.br`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  uploads: