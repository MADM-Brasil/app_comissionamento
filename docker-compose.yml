services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}   # será fornecida no Dokploy
      DB_SSL: ${DB_SSL:-false}        # ajuste conforme o banco externo exigir SSL
      SESSION_SECRET: ${SESSION_SECRET:-super-secret}
      NODE_ENV: production
      FRONTEND_URL: https://comissionamento.madmbrasil.com.br
      PORT: 3007
    volumes:
      - uploads:/app/uploads
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`comissionamento.madmbrasil.com.br`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  internal:
    driver: bridge

volumes:
  uploads: